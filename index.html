<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Naafiri">
<meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111213" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Naafiri</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#0b0b0a;--mut:#6f6f6b;--line:#e6e6e2;--acc:#a43cf0;--act:#7d22c9;--tint:#f0e2fd;--on:#fff;--red:#e5484d;--ok:#16a34a;--cb:#f5a524;--pr:#e2549b;--fa:#3b9df5;color-scheme:light}
/* Thème : auto (selon le téléphone), clair ou sombre forcé (data-theme sur <html>, comme Muscu) */
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111213;--card:#1c1d1f;--ink:#f4f4f0;--mut:#9a9ca0;--line:#2f3134;--acc:#b65cff;--act:#d6a4ff;--tint:#2c2238;--on:#fff;--red:#f27272;--ok:#3ad981;--cb:#ffb547;--pr:#f06aac;--fa:#5bb0ff;color-scheme:dark}}
:root[data-theme=dark]{--bg:#111213;--card:#1c1d1f;--ink:#f4f4f0;--mut:#9a9ca0;--line:#2f3134;--acc:#b65cff;--act:#d6a4ff;--tint:#2c2238;--on:#fff;--red:#f27272;--ok:#3ad981;--cb:#ffb547;--pr:#f06aac;--fa:#5bb0ff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
/* La page ne défile pas : c'est #app qui défile (le rebond d'iOS ne bouge jamais la barre d'onglets) */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Trebuchet MS",system-ui,sans-serif}
main#app{position:fixed;inset:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:env(safe-area-inset-top) max(12px,calc((100% - 640px)/2)) calc(100px + env(safe-area-inset-bottom))}
h1{font:800 28px/1.15 "Avenir Next","Trebuchet MS",system-ui,sans-serif;letter-spacing:-.01em;margin:16px 0}
h2{font:700 18px/1.2 "Avenir Next","Trebuchet MS",system-ui,sans-serif;margin:22px 0 10px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
header.sh{justify-content:flex-start}
header.sh h1{flex:1;min-width:0;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:16px;outline:none}
input:focus{border-color:var(--acc)}
.mut{color:var(--mut);font-size:14px}
.ib{flex:none;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.ib.ac{background:var(--acc);border-color:var(--acc);color:var(--on)}
.fc{font-family:"Avenir Next Condensed","Arial Narrow","Avenir Next",system-ui,sans-serif;font-weight:800;letter-spacing:-.01em}

/* Barre d'onglets (même pilule flottante que Muscu et MangaTime) */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 24px));display:flex;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:5;view-transition-name:tabs}
.tabs button{flex:1;min-width:0;border-radius:999px;display:flex;flex-direction:column;align-items:center;font-size:11.5px;padding:6px 2px;color:var(--mut)}
.tabs button.on{background:var(--tint);color:var(--act);font-weight:700}
.tabs span{display:block;height:24px;margin-bottom:2px}

/* Bandeau des jours */
.dh{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.dh h1{margin:0;font-size:26px;flex:1;min-width:0}
.wk .wa{flex:none;width:26px;padding:0;align-self:center;color:var(--mut)}
.dh h1 small{display:block;font:500 13px "Avenir Next",system-ui,sans-serif;color:var(--mut);letter-spacing:0}
.wk{display:flex;gap:4px;margin:8px 0 4px}
.wk button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 8px;border-radius:14px;font-size:11px;color:var(--mut)}
.wk button b{font-size:15px;color:var(--ink);width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.wk button.on{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.wk button.on b{background:var(--acc);color:var(--on)}
.wk button.td b{box-shadow:inset 0 0 0 2px var(--acc)}
.wk button.on.td b{box-shadow:none}
.wk i{width:5px;height:5px;border-radius:50%;background:transparent}
.wk i.lg{background:var(--acc)}.wk i.ov{background:var(--red)}

/* Résumé du jour */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.sum{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sum .sd{flex:1;text-align:center}
.sum .sd b{display:block;font-size:22px}
.sum .sd small{color:var(--mut);font-size:12.5px}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .rc b{font-size:32px;line-height:1}
.ring .rc small{font-size:12.5px;color:var(--mut);margin-top:4px}
.ring.ov .rc b{color:var(--red)}
.mac{display:flex;gap:14px;margin-top:14px}
.mac>div{flex:1;min-width:0}
.mac small{display:block;font-size:12px;color:var(--mut);white-space:nowrap}
.mac b{font-size:14px}
.bar{height:6px;border-radius:9px;background:var(--line);margin:5px 0 3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--acc)}
.bar.ov i{background:var(--red)!important}
.onb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--tint);color:var(--act);border-radius:18px;padding:12px 14px;margin:10px 0;font-size:14px;font-weight:600}
.onb svg{flex:none}

/* Repas */
.ml{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.mh{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px}
.mh .mi0{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.mh .tx{flex:1;min-width:0}
.mh .tx b{display:block;font-size:17px}
.mh .tx small{color:var(--mut);font-size:13px}
.mh .fo2{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left}
.mh .chv{flex:none;color:var(--mut);transition:transform .2s}
.ml.op .mh .chv{transform:rotate(90deg)}
/* Ligne qu'on glisse vers la gauche pour faire apparaître la poubelle */
.sw{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.sw .swd{position:absolute;top:0;right:0;bottom:0;width:80px;background:var(--red);color:#fff;display:grid;place-items:center}
.sw .er{position:relative;background:var(--card);border-top:0;transition:transform .22s cubic-bezier(.3,.7,.2,1);touch-action:pan-y}
.sw .er.dg{transition:none}
/* Bulle du jour : glisser pour changer de jour */
#sumc{touch-action:pan-y}
#app.swb{transition:none;box-shadow:-10px 0 30px rgba(0,0,0,.25)}#app.swr{transition:transform .24s cubic-bezier(.3,.7,.2,1);box-shadow:-10px 0 30px rgba(0,0,0,.25)}
#sumc.dg{transition:none}#sumc.bk{transition:transform .22s,opacity .22s}
#sumc.inR{animation:sinR .26s cubic-bezier(.3,.7,.2,1)}#sumc.inL{animation:sinL .26s cubic-bezier(.3,.7,.2,1)}
@keyframes sinR{from{transform:translateX(40%);opacity:0}}@keyframes sinL{from{transform:translateX(-40%);opacity:0}}
/* Compteur d'aliments du repas (page Ajouter) */
.cnt{flex:none;min-width:40px;height:40px;padding:0 10px;border-radius:999px;background:var(--acc);color:var(--on);font-weight:800;font-size:16px;display:grid;place-items:center}
.cnt.z{background:var(--card);color:var(--mut);border:1px solid var(--line);box-shadow:none}
.cnt.pop{animation:cpop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes cpop{40%{transform:scale(1.3)}}
.pl{flex:none;width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--act);display:grid;place-items:center}
.pl:active{transform:scale(.92)}
.er{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border-top:1px solid var(--line)}
.er .tx{flex:1;min-width:0}
.er .tx b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er .tx small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er .kc{flex:none;font-size:14px;font-weight:700}
.er .kc small{font-weight:500;color:var(--mut);font-size:12px}

.rowh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rowh b{font-size:17px}
.rowh small{color:var(--mut);font-size:13px}
.lnk{color:var(--act);font-weight:700;font-size:14px;padding:4px 0 4px 10px}

/* Recherche et listes d'aliments */
.srch{position:relative;flex:1;min-width:0}
.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
.srch input{padding:12px 46px 12px 44px;border-radius:999px;-webkit-appearance:none;appearance:none}
.srch input::-webkit-search-cancel-button{display:none}
.clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--ink) 12%,transparent);display:grid;place-items:center}
.clr svg{position:static;transform:none;color:var(--ink)}
.clr[hidden]{display:none}
.sbar{display:flex;gap:8px;align-items:center;margin:6px 0 4px}
.sbar .ib{width:46px;height:46px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -12px;padding:0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}
.chips.eq{margin:10px 0;padding:0;overflow:visible}
.chips.eq{gap:5px}.chips.eq .chip{flex:1 1 0;min-width:0;text-align:center;padding:9px 1px;font-size:12.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
/* Mes repas : liste des aliments d'un repas enregistré */
.tpl .th{background:var(--acc);color:var(--on)}
.tpi{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.tpi:first-child{border-top:0}
.tpi .tx{flex:1;min-width:0;text-align:left}
.tpi .tx b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpi .tx small{display:block;color:var(--mut);font-size:12.5px}
.tpi .kc{flex:none;font-size:14px;font-weight:700}
.tpi .d{flex:none;color:var(--red);width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.tpn{font:700 20px "Avenir Next","Trebuchet MS",system-ui,sans-serif}
.fl{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:8px 0}
.fr{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-top:1px solid var(--line)}
.fr:first-child{border-top:0}
.fr .fo{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.th{flex:none;width:44px;height:44px;border-radius:12px;overflow:hidden;background:var(--tint);color:var(--act);display:grid;place-items:center;font-weight:800;font-size:17px}
.th img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.fo .tx{flex:1;min-width:0}
.fo .tx b{display:block;font-size:15px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fo .tx small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa{flex:none;width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--act);display:grid;place-items:center}
.qa:active{transform:scale(.9)}
.qa.in{background:var(--acc);color:var(--on)}
.ns{display:inline-block;font-size:10px;font-weight:800;color:#fff;border-radius:5px;padding:1px 5px;margin-right:5px;vertical-align:1px}
.ns.a{background:#038141}.ns.b{background:#85bb2f}.ns.c{background:#e6a800}.ns.d{background:#ee8100}.ns.e{background:#e63e11}
.emp{text-align:center;color:var(--mut);font-size:14px;padding:26px 16px}
.lbl{font:12px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--mut);margin:22px 4px 8px;text-transform:uppercase}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:999px;background:var(--acc);color:var(--on);font-weight:700;font-size:16px;margin:10px 0}
.big.ol{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.two{display:flex;gap:8px}.two>*{flex:1}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:rot .8s linear infinite;margin:20px auto}
@keyframes rot{to{transform:rotate(1turn)}}

/* Progrès */
.st3{display:flex;gap:8px}
/* Profil : carte d'identité, objectif du jour, liste avec icônes */
.phd{display:flex;align-items:center;gap:14px}.pav{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--act)}
.pid{flex:1;min-width:0}.pid b{display:block;font-size:18px}.pid small{color:var(--mut);font-size:13px}
.pgl{font:11px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--mut)}
.pgk{display:flex;align-items:baseline;gap:6px;margin:4px 0 12px}.pgk b{font-size:40px;line-height:1}.pgk span{color:var(--mut);font-weight:600}
.pmc{display:flex;gap:8px}.pmc>div{flex:1;background:var(--bg);border-radius:14px;padding:10px 8px;text-align:center}.pmc i{display:block;width:18px;height:4px;border-radius:9px;margin:0 auto 6px}.pmc b{display:block;font-size:16px}.pmc small{font-size:11.5px;color:var(--mut)}
.pst{display:flex;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.pst>div{flex:1;text-align:center}.pst>div+div{border-left:1px solid var(--line)}.pst b{display:block;font-size:16px}.pst small{font-size:11.5px;color:var(--mut)}
.prow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line);color:var(--mut)}.prow:first-child{border-top:0}
.prow i{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
.prow span{flex:1;min-width:0}.prow b{display:block;color:var(--ink);font-size:16px;font-weight:600}.prow small{display:block;font-size:13px;color:var(--mut)}
.cred .crl{display:block;line-height:1.7}
.st3>div{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.st3 b{display:block;font-size:22px}
.st3 small{color:var(--mut);font-size:12px}
/* Calendrier du mois (Progrès) : vert = objectif atteint, rouge = hors objectif */
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calh b{font-size:17px;text-transform:capitalize;flex:1;text-align:center}
.calh .ib{width:34px;height:34px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;text-align:center}
.cal span{font-size:11px;color:var(--mut);font-weight:600;padding-bottom:2px}
.cal button{position:relative;width:100%;max-width:42px;aspect-ratio:1;margin:0 auto;padding:0;border-radius:50%;font-size:14px;font-weight:600;line-height:1;color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent);font-variant-numeric:tabular-nums}
.cal button b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:inherit}
.cal button.ok{background:var(--ok);color:#fff}
.cal button.ko{background:var(--red);color:#fff}
.cal button.td{box-shadow:0 0 0 2px var(--acc)}
.cal button.fu{opacity:.35}
.cal button:disabled{visibility:hidden}
.calg{display:flex;justify-content:center;gap:16px;margin-top:12px;font-size:12.5px;color:var(--mut)}
.calg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.chart text{font-size:10px;fill:var(--mut);font-family:inherit}

/* Réglages en cartes groupées (comme Muscu) */
.ocard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.orow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.orow:first-child{border-top:0}
.orow span{color:var(--mut);text-align:right}
.orow.fld{flex-direction:column;align-items:stretch;gap:8px}
.orow.fld b{font-size:17px;font-weight:600}
.orow.hint{font-size:14px;color:var(--mut);display:block}
.orow.go{color:var(--act);font-weight:700}
.cred{font-size:12px;color:var(--mut);margin:20px 4px 0}
.seg2{display:flex;gap:4px;padding:5px;background:var(--bg);border:1px solid var(--line);border-radius:18px}
.seg2 button{flex:1;padding:14px 0;border-radius:13px;background:none;color:var(--mut);font:600 15px ui-monospace,Menlo,monospace;letter-spacing:.12em}
.seg2 button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.accs{display:flex;justify-content:space-between;gap:6px;padding:12px 14px;margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:18px}
.accs button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.accs button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--c)}
.opl{font:12px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--mut);margin:22px 4px 8px}
.soft{background:color-mix(in srgb,var(--ink) 4%,var(--card));border:1px solid color-mix(in srgb,var(--line) 55%,transparent);font-weight:600}
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 16px;margin:10px 0}
.mi i{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.mi b{display:block;font-size:18px;font-weight:600;line-height:1.25}
.mi small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.mi.gr i{background:var(--acc);color:var(--on)}
.mi small:empty{display:none}
.cred a{color:var(--act)}
.inl{display:flex;gap:8px}
.inl input{flex:1;min-width:0}
.inl .u{flex:none;align-self:center;color:var(--mut);font-size:14px;min-width:34px}

/* Feuilles et pop-ups (mêmes formes que Muscu) */
.sov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fd .18s}
.sov.pop{align-items:center;padding:20px}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;will-change:transform;border-radius:28px 28px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.22,.9,.3,1)}
.na,.na .sheet,.na .dpop{animation:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px;position:relative}
.grab:after{content:"";position:absolute;inset:-14px -60px}
.sheet h2{margin:4px 0 4px;font-size:22px}
.shh{display:flex;align-items:flex-start;gap:10px}
.shh>div{flex:1;min-width:0}
.shh small{color:var(--mut);font-size:13px}
.star{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.star.on{color:#f5a524}
.qk{text-align:center;margin:14px 0 4px}
.qk b{font-size:44px;line-height:1}
.qk small{display:block;color:var(--mut);font-size:13px}
.qm{display:flex;gap:8px;margin:12px 0}
.qm>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.qm b{display:block;font-size:17px}
.qm small{font-size:12px;color:var(--mut)}
.qm i{display:block;width:22px;height:4px;border-radius:9px;margin:0 auto 6px}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 0 4px}
/* Roulette (comme le sélecteur d'iOS) : liste à défilement aimanté, la valeur au centre est la valeur choisie */
.whw{position:relative;height:200px;margin:0 12px;display:flex;justify-content:center;gap:64px}
.whc{position:relative;flex:0 0 25%;min-width:0}.whc.un{flex:0 0 48%}
.whw .wh button{padding:0 6px}
.whw .wh.un button{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whw .wh.un button.on{font-size:17px;color:var(--act)}
/* Deux rectangles violets : un autour du nombre choisi, un autour de l'unité choisie */
.whb{position:absolute;left:0;right:0;top:80px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--acc) 16%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 45%,transparent)}
.wh{position:relative;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wh::-webkit-scrollbar{display:none}
.wh:before,.wh:after{content:"";display:block;height:80px}
.wh button{display:block;width:100%;height:40px;scroll-snap-align:center;text-align:center;font-size:19px;font-weight:600;color:var(--mut);transition:color .15s,font-size .15s}
.wh button.on{color:var(--ink);font-size:26px;font-weight:800}
.qg{text-align:center;color:var(--mut);font-size:13px;margin:6px 0 2px}
.qbox .chips{margin:8px 0;padding:0 12px}
.qbox .chips.qv .chip{min-width:52px;text-align:center}
.qbox .chips.wr{flex-wrap:wrap;overflow:visible}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mg button{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:15px;text-align:left}
.mg button i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.mg button.on{border-color:var(--acc);background:var(--tint);font-weight:700;color:var(--act)}
.mg button.on i{background:var(--acc);border-color:var(--acc);color:var(--on)}
.nut{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 14px;margin:10px 0}
.nut div{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.nut div:first-child{border-top:0}
.nut div.sb{padding-left:14px;color:var(--mut);font-size:13px}
/* Détail nutritionnel complet (page « nut » et feuille quantité) */
.nt{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px 16px;margin:12px 0}
.nt section{padding:10px 0;border-top:1px solid var(--line)}
.nt section:first-child{border-top:0}
.nt div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:15px;color:var(--mut)}
.nt div.h{color:var(--ink);font-weight:700;font-size:16px}
.nt div.i2{padding-left:22px}
.nt div span:last-child{flex:none;font-variant-numeric:tabular-nums}
.nt div.h span:last-child{color:var(--ink)}
.dlk{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;border-top:1px solid var(--line);color:var(--act);font-weight:700;font-size:14px}
.dlk.qft{border:1px solid var(--line);background:var(--card);border-radius:16px;margin:0 0 10px}
.dlk.qft svg{transition:transform .2s}.dlk.qft.op svg{transform:rotate(90deg)}
.card .dlk{border-top:1px solid var(--line);margin:14px -16px -16px;width:calc(100% + 32px);border-radius:0 0 22px 22px}
.del{display:block;margin:6px auto 0;color:var(--red);font-size:15px;padding:10px}
.warn{color:var(--red);font-size:13px;margin:4px 4px 0}
.cam{position:relative;width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:#000;margin:10px 0}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam:after{content:"";position:absolute;left:12%;right:12%;top:38%;bottom:38%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam p{position:absolute;inset:auto 0 10px;margin:0;text-align:center;color:#fff;font-size:13px;z-index:2}
.sov.out{animation:fdo .26s ease-in forwards}
.sov.out .sheet{animation:dn .28s cubic-bezier(.4,0,.8,.4) forwards}
.sov.out .dpop{animation:ppo .2s ease-in forwards}
.dpop{background:var(--card);width:100%;max-width:330px;border-radius:36px;padding:24px 22px 18px;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:pp .2s}
.dpop h3{margin:0 0 8px;font:600 20px "Avenir Next","Trebuchet MS",system-ui,sans-serif}
.dpop p{margin:0 0 6px;color:var(--mut);font-size:15px}
.dbt{display:block;width:100%;border-radius:999px;padding:15px 12px;margin-top:10px;background:color-mix(in srgb,var(--ink) 7%,var(--card));font:500 17px "Avenir Next","Trebuchet MS",system-ui,sans-serif}
.dbt.gr{background:var(--acc);color:var(--on);font-weight:700}
.dbt.red{color:var(--red)}
.dbt.tx{background:none;color:var(--mut)}

 const mx=Math.max(G.k*1.25,...D.map(d=>d[1])),y=v=>10+(1-v/mx)*(H-30),bw=28,gap=(W-16-7*bw)/6;
 return`<svg class=chart viewBox="0 0 ${W} ${H}">${D.map(([k,v],i)=>{const x=8+i*(bw+gap);return`<rect x=${x} y=${y(v)} width=${bw} height=${Math.max(0,H-20-y(v))} rx=7 fill="var(${v>goalsFor(k).k*1.05?'--red':'--acc'})" opacity="${k===t?1:.75}"/><text x=${x+bw/2} y=${H-4} text-anchor=middle>${'DLMMJVS'[pd(k).getDay()]}</text>`}).join('')}
  <line x1=4 x2=${W-4} y1=${y(G.k)} y2=${y(G.k)} stroke="var(--mut)" stroke-dasharray="4 4"/><text x=${W-4} y=${y(G.k)-4} text-anchor=end>${fmt(G.k)}</text></svg>`}
/* Un jour noté est « atteint » s'il est entre 90 % et 110 % de l'objectif du jour */
const CALLO=.9,CALHI=1.1;
function calHtml(G){const[y,m]=CALM.split('-').map(Number),d0=new Date(y,m-1,1),n=new Date(y,m,0).getDate(),off=(d0.getDay()+6)%7,t=TODAY();let h='',ok=0,ko=0;
 for(let i=0;i<off;i++)h+='<button disabled></button>';
 for(let d=1;d<=n;d++){const k=CALM+'-'+String(d).padStart(2,'0'),D=dayR(k),kc=D.e.length?sum(D.e).k:0,gk=goalsFor(k).k,c=kc?(kc>=gk*CALLO&&kc<=gk*CALHI?'ok':'ko'):'';if(c==='ok')ok++;else if(c)ko++;
  h+=`<button class="${c}${k===t?' td':''}${k>t?' fu':''}" data-a=cday data-d=${k} aria-label="${d}${kc?' : '+fmt(kc)+' kcal':''}"><b>${d}</b></button>`}
 const lab=d0.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
 return`<div class=card><div class=calh><button class=ib data-a=calm data-n=-1 aria-label="Mois précédent">${SI('l',18)}</button><b>${lab}</b><button class=ib data-a=calm data-n=1 aria-label="Mois suivant">${SI('r',18)}</button></div>
 <div class=cal>${'LMMJVSD'.split('').map(x=>`<span>${x}</span>`).join('')}${h}</div>
 <div class=calg><span><i style="background:var(--ok)"></i>Objectif atteint : ${ok}</span><span><i style="background:var(--red)"></i>Hors objectif : ${ko}</span></div>
 <p class=mut style="text-align:center;margin:6px 0 0;font-size:12px">Vert : entre 90 et 110 % de l’objectif du jour (${fmt(G.k*CALLO)} à ${fmt(G.k*CALHI)} kcal aujourd’hui). Touche un jour pour l’ouvrir.</p></div>`}
function vProg(){const G=goals();
 const D7=[];for(let i=0;i<7;i++){const d=dayR(addD(TODAY(),-i));if(d.e.length)D7.push(sum(d.e))}
 const av=x=>D7.length?D7.reduce((a,v)=>a+v[x],0)/D7.length:0;
 let h=`<div class=dh><h1 class=fc>Progrès</h1>${gear()}</div>
 <div class=card><b>Macros moyennes · 7 jours</b><div class=mac>${[['Glucides','c','--cb'],['Protéines','p','--pr'],['Lipides','f','--fa']].map(([l,x,c])=>`<div><small>${l}</small>${bar(av(x),G[x],c)}<b>${fmt(av(x))}</b><small style="display:inline"> / ${fmt(G[x])} g</small></div>`).join('')}</div></div>
 ${calHtml(G)}
 <div class=card><div class=rowh><div><b>Calories · 7 derniers jours</b><br><small>${D7.length?`Moyenne ${fmt(av('k'))} kcal par jour noté`:'Aucun repas noté cette semaine'}</small></div></div>${weekChart(G)}</div>`;
 return h+tabbar()}

/* Unités : portions propres à l'aliment (p, p1, p2…, pk = paquet), puis g / kg / mL / L (1 mL compté comme 1 g) */
const UB=[['g','g',1],['kg','kg',1000],['ml','mL',1],['l','L',1000]];
const WH=40;let WV=[];                          // hauteur d'une ligne de la roulette, valeurs affichées
function whVals(k,cur){const L=[],a=(f,t,st)=>{for(let x=f;x<=t+1e-9;x+=st)L.push(Math.round(x*100)/100)};
 if(k==='p'){a(.25,3,.25);a(3.5,10,.5);a(11,30,1)}else if(k==='kg'||k==='l'){a(.05,3,.05);a(3.1,10,.1)}else{a(1,1000,1);a(1010,3000,10)}
 cur=Math.round(num(cur)*100)/100;if(cur>0&&!L.includes(cur)){L.push(cur);L.sort((x,y)=>x-y)}return L}
const wf=x=>String(Math.round(x*100)/100).replace('.',',');
function whHtml(){const k=uk(F.un),n=Math.round(num(F.nb)*100)/100;WV=whVals(k,n);return WV.map((x,i)=>`<button class="${x===n?'on':''}" data-a=whv data-i=${i}>${wf(x)}</button>`).join('')}
const whUHtml=()=>units(F.fd).map(([x,l,g],i)=>`<button class="${F.un===x?'on':''}" data-a=whu data-i=${i}>${x[0]==='p'?esc(plab(l)):l}</button>`).join('');
function whInit(only){const w=$('#wh'),u=$('#whu');if(w)w.scrollTop=Math.max(0,WV.indexOf(Math.round(num(F.nb)*100)/100))*WH;if(u&&!only)u.scrollTop=Math.max(0,units(F.fd).findIndex(x=>x[0]===F.un))*WH}
/* Changement d'unité : on garde le même poids (une portion → 1 portion), puis on reconstruit la roulette des nombres */
function setUnit(un){const U=units(F.fd),o=U.find(x=>x[0]===F.un),n=U.find(x=>x[0]===un);if(!n||o===n)return;
 if(o){const g=num(F.nb)*o[2];F.nb=n[0][0]==='p'?1:n[0]==='g'||n[0]==='ml'?Math.max(1,Math.round(g)):Math.max(.05,Math.round(g/n[2]*20)/20)}else F.nb=n[0][0]==='p'?1:100;
 F.un=un;const w=$('#wh');if(w){w.innerHTML=whHtml();whInit(1)}paintQty()}
function whGo(v,smooth){const w=$('#wh');if(!w)return;v=Math.round(v*100)/100;if(!WV.includes(v)){F.nb=v;w.innerHTML=whHtml();return whInit()}w.scrollTo({top:WV.indexOf(v)*WH,behavior:smooth?'smooth':'auto'})}
/* Quand la roulette tourne : la valeur au centre devient la quantité */
document.addEventListener('scroll',e=>{const w=e.target;if(!w||!F||F.k!=='qty')return;
 if(w.id==='whu'){const U=units(F.fd),i=Math.max(0,Math.min(U.length-1,Math.round(w.scrollTop/WH)));if(U[i][0]===F.un)return;w.querySelectorAll('.on').forEach(b=>b.classList.remove('on'));if(w.children[i])w.children[i].classList.add('on');return setUnit(U[i][0])}
 if(w.id!=='wh')return;const i=Math.max(0,Math.min(WV.length-1,Math.round(w.scrollTop/WH))),v=WV[i];
 if(v===Math.round(num(F.nb)*100)/100)return;F.nb=v;w.querySelectorAll('.on').forEach(b=>b.classList.remove('on'));if(w.children[i])w.children[i].classList.add('on');paintQty()},true);
const uk=u=>u[0]==='p'?'p':u;
function units(o){const P=[];if(o.sv)P.push(['p',o.svn||'1 portion',o.sv]);(o.ps||[]).forEach((x,i)=>P.push(['p'+(i+1),x[0],x[1]]));if(o.pk&&o.pk!==o.sv)P.push(['pk','1 paquet',o.pk]);return P.concat(UB)}
const plab=l=>String(l).replace(/^1\s+/,'');

function defQ(o){if(o.tpid)return{un:'p',nb:1};const s=S.foods[o.id],l=s&&s.lq;if(l&&units(o).some(u=>u[0]===l.un))return l;return{un:'g',nb:o.sv?Math.max(1,Math.round(o.sv)):100}}

/* Ajoute l'aliment à un ou plusieurs repas ; en modification, l'entrée garde son id dans le premier repas choisi (le sien s'il est coché) */
function addEntry(o,ms,un,nb,eid){if(!Array.isArray(ms))ms=[ms];const u=units(o).find(x=>x[0]===un)||UB[0],q=num(nb)*u[2];if(!(q>0)||!ms.length)return false;

 toast(e0&&!rest.length?'Modifié':`${o.n} · ${fmt(o.k*q/100)} kcal${ms.length>1?' · '+ms.length+' repas':''}`,()=>{const D=dayW(CUR);D.e=D.e.filter(x=>!add.includes(x.id));if(e0){const j=D.e.findIndex(x=>x.id===e0.id);if(j>=0)D.e[j]=e0}touch(D);render()});return true}

/* ============ Scan du code-barres ============ */
let SCN=null;
/* Codes-barres EAN / UPC : on ne garde que les chiffres, UPC-A (12) devient EAN-13, et le chiffre de contrôle doit être juste */
function gtin(t){let c=String(t||'').replace(/\D/g,'');if(c.length===12)c='0'+c;if(c.length!==8&&c.length!==13)return null;
 const d=c.split('').map(Number),ck=d.pop();let x=0;d.reverse().forEach((n,i)=>x+=n*(i%2?1:3));return(10-x%10)%10===ck?c:null}
/* Scan : on lit seulement la zone du cadre (image recadrée sur un canvas), et un code n'est accepté que s'il est lu 2 fois à l'identique */
async function startScan(){stopScan();const me={n:{}};SCN=me;const v=$('#cam'),msg=m=>{const p=$('#cmsg');if(p)p.textContent=m};
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return msg('Caméra indisponible : tape le code ci-dessous.');
 try{me.st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});if(SCN!==me)return me.st.getTracks().forEach(t=>t.stop());
  v.srcObject=me.st;await v.play();
  try{const tr=me.st.getVideoTracks()[0],cp=tr.getCapabilities?tr.getCapabilities():{};if((cp.focusMode||[]).includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch{}
  let dec;
  if('BarcodeDetector' in window&&(await BarcodeDetector.getSupportedFormats()).includes('ean_13')){const bd=new BarcodeDetector({formats:['ean_13','ean_8','upc_a']});dec=async c=>{const r=await bd.detect(c);return r[0]&&r[0].rawValue}}
  else{if(!window.ZXing)await new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='zxing.min.js';sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc)});if(SCN!==me)return;
   const Z=window.ZXing,h=new Map(),rd=new Z.MultiFormatReader();h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A]);h.set(Z.DecodeHintType.TRY_HARDER,true);rd.setHints(h);
   dec=c=>{try{return rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))).getText()}catch{return null}}}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const loop=async()=>{if(SCN!==me)return;const W=v.videoWidth,H=v.videoHeight;
   if(W&&H){const sw=W*.84,sh=H*.5,k=Math.min(1,1200/sw);cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);cx.drawImage(v,W*.08,H*.25,sw,sh,0,0,cv.width,cv.height);
    let t=null;try{t=await dec(cv)}catch{}const c=gtin(t);if(c){me.n[c]=(me.n[c]||0)+1;if(me.n[c]>=2)return found(c);msg('Lecture de '+c+'…')}}
   setTimeout(loop,90)};loop()}
 catch(e){msg(e&&e.name==='NotAllowedError'?'Accès à la caméra refusé : autorise-le dans les réglages, ou tape le code.':'Caméra indisponible : tape le code ci-dessous.')}}
function stopScan(){const s=SCN;SCN=null;if(!s)return;if(s.st)s.st.getTracks().forEach(t=>t.stop())}

 catch(e){if(F&&F.k==='scan'){F=Object.assign({},F,{msg:'Erreur réseau, réessaie.'});render();startScan()}}}

/* Gestes horizontaux : glisser une ligne d'aliment vers la gauche (poubelle) et glisser la bulle du jour (jour précédent / suivant) */
let HZ=null,SWO=null,NOCL=0,NOSL=0;
const swSet=(el,x,anim)=>{el.classList.toggle('dg',!anim);el.style.transform=x?`translateX(${x}px)`:''};
function swClose(){if(SWO&&SWO.isConnected)swSet(SWO,0,1);SWO=null}
document.addEventListener('touchstart',e=>{HZ=null;if(e.touches.length>1||F)return;const t=e.touches[0],row=e.target.closest('.sw .er'),card=e.target.closest('#sumc');
 if(SUBV&&t.clientX<24){HZ={k:'edge',el:$('#app'),x:t.clientX,y:t.clientY,dx:0,ax:0,t:Date.now()};return}
 if(SWO&&row!==SWO&&!e.target.closest('.swd'))swClose();
 if(row)HZ={k:'row',el:row,x:t.clientX,y:t.clientY,b:row===SWO?-80:0,dx:0,ax:0};
 else if(card)HZ={k:'day',el:card,x:t.clientX,y:t.clientY,dx:0,ax:0}},{passive:true});
document.addEventListener('touchmove',e=>{const h=HZ;if(!h)return;const t=e.touches[0],dx=t.clientX-h.x,dy=t.clientY-h.y;
 if(!h.ax){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;h.ax=Math.abs(dx)>Math.abs(dy)?'x':'y'}
 if(h.ax!=='x')return;if(e.cancelable)e.preventDefault();h.dx=dx;
 if(h.k==='edge'){h.el.classList.add('swb');h.el.style.transform=`translateX(${Math.max(0,dx)}px)`;return}
 if(h.k==='row')swSet(h.el,Math.max(-110,Math.min(0,h.b+dx)));
 else{h.el.classList.add('dg');h.el.style.transform=`translateX(${dx}px)`;h.el.style.opacity=1-Math.min(.6,Math.abs(dx)/500)}},{passive:false});
document.addEventListener('touchend',()=>{const h=HZ;HZ=null;if(!h||h.ax!=='x')return;NOCL=Date.now();
 if(h.k==='edge'){const el=h.el,w=innerWidth,v=h.dx/Math.max(1,Date.now()-h.t),go=h.dx>w*.35||(v>.5&&h.dx>40);el.classList.remove('swb');el.classList.add('swr');el.style.transform=go?`translateX(${w}px)`:'';
  return setTimeout(()=>{el.classList.remove('swr');if(go){NOSL=1;history.back();requestAnimationFrame(()=>{el.style.transform=''})}},240)}
 if(h.k==='row'){const x=h.b+h.dx;if(x<-40){swSet(h.el,-80,1);SWO=h.el}else{swSet(h.el,0,1);if(SWO===h.el)SWO=null}return}
 const el=h.el;el.classList.remove('dg');
 if(Math.abs(h.dx)<70){el.classList.add('bk');el.style.transform='';el.style.opacity='';return setTimeout(()=>el.classList.remove('bk'),240)}
 CUR=addD(CUR,h.dx<0?1:-1);render();const n=$('#sumc');if(n)n.classList.add(h.dx<0?'inR':'inL')});

/* ============ Synchro GitHub (même principe que Muscu et MangaTime) ============ */
const dataOut=()=>({days:S.days,foods:S.foods,wt:S.wt,tp:S.tp,prof:S.prof,del:S.del});
const api=()=>`https://api.github.com/repos/${S.cfg.repo}/contents/${S.cfg.path||'naafiri-data.json'}`;
const H=()=>({Authorization:'Bearer '+S.cfg.token,Accept:'application/vnd.github+json'});
async function pull(){const r=await fetch(api(),{headers:H(),cache:'no-store',signal:TO()});if(r.status===404){S.sha='';return null}
 if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();S.sha=j.sha;
 return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0))))}
async function push(){let b='';new TextEncoder().encode(JSON.stringify(dataOut())).forEach(c=>b+=String.fromCharCode(c));
 const r=await fetch(api(),{method:'PUT',signal:TO(20e3),headers:H(),body:JSON.stringify({message:'Sync '+new Date().toISOString(),content:btoa(b),sha:S.sha||undefined})});
 if(!r.ok)throw new Error('GitHub '+r.status);S.sha=(await r.json()).content.sha}
/* Fusion : journée par journée, aliment par aliment, pesée par pesée, selon u (le plus récent gagne) ; suppressions datées dans del */
function mrgMap(L,R,del){let newer=false;R=R||{};
 for(const k in R){const l=L[k],r=R[k];if(!r)continue;if((del&&(del[k]||0)>(r.u||0)))continue;if(!l||(r.u||0)>(l.u||0))L[k]=r}
 for(const k in L){if(del&&(del[k]||0)>(L[k].u||0)){delete L[k];continue}if(!R[k]||(L[k].u||0)>(R[k].u||0))newer=true}
 return newer}
function merge(rm){const rd=rm.del||{};let n=false;
 for(const t of['f','w','t'])for(const k in rd[t]||{})if((rd[t][k]||0)>(S.del[t][k]||0))S.del[t][k]=rd[t][k];
 for(const t of['f','w','t'])for(const k in S.del[t])if(!rd[t]||(S.del[t][k]||0)>(rd[t][k]||0))n=true;
 n=mrgMap(S.days,rm.days)||n;n=mrgMap(S.foods,rm.foods,S.del.f)||n;n=mrgMap(S.wt,rm.wt,S.del.w)||n;n=mrgMap(S.tp,rm.tp,S.del.t)||n;
 if(rm.prof&&(rm.prof.u||0)>(S.prof.u||0))S.prof=Object.assign(S.prof,rm.prof);else if(!rm.prof||(S.prof.u||0)>(rm.prof.u||0))n=true;
 return n}
let SYNCING=false,SY=0;
async function sync(manual){if(!S.cfg.repo||!S.cfg.token){if(manual)setMsg('Renseigne le dépôt et le jeton.');return}
 if(SYNCING)return;SYNCING=true;
 try{const rm=await pull(),newer=rm?merge(rm):true;
  if(newer||S.dirty){try{await push()}catch{const r2=await pull();if(r2)merge(r2);await push()}}
  S.dirty=0;MSG='Synchronisé à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
 catch(e){MSG='Échec : '+e.message+' (vérifie dépôt, jeton, réseau)'}
 SYNCING=false;persist();setMsg(MSG);if(!F&&!(document.activeElement&&document.activeElement.matches('input')))render()}
function schedSync(){clearTimeout(SY);SY=setTimeout(()=>sync(),4000)}
